name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # refresh the news wire every 3 hours
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site (only public files) + fetch news
        run: |
          node tests/i18n.mjs
          node tests/news.mjs
          node tests/security.mjs
          node tests/advisor.mjs
          node tests/tonight.mjs
          node tests/filters.mjs
          node tests/contrast.mjs
          mkdir -p _site/news
          cp -r index.html sw.js manifest.webmanifest icons css js fonts LICENSE _site/
          cp news/feeds.json _site/news/ 2>/dev/null || true
          node scripts/fetch-news.mjs _site/news/news.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
