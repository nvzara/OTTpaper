<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Security: only our own scripts/styles/fonts; network only to TMDB (data) and its image CDN. No third parties. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https://api.themoviedb.org; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="OTTpaper – a free, non-commercial personal tool to find where movies and TV shows can be streamed.">
<title>OTTpaper – OTT 통합 검색</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c5ce7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='4'/%3E%3Cpath d='m10 9 5 3-5 3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="mast">
  <div class="mast-line"><span id="dateline"></span><span id="edition"></span></div>
  <a class="brand" href="#/">OTTpaper</a>
  <p class="motto" id="motto"></p>
</header>
<div class="bar">
  <form id="searchForm" role="search">
    <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search">
  </form>
  <nav class="nav" aria-label="Menu"><a id="navHome" href="#/"></a><a id="navNews" href="#/news"></a><a id="navClips" href="#/clippings"></a><a id="navSet" href="#/settings"></a></nav>
</div>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<footer class="attrib">
  <p id="f1"></p>
  <p id="f2"></p>
  <p id="f3"></p>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
