<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Security: only our own scripts/styles/fonts; network only to TMDB (data) and its image CDN. No third parties. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https://api.themoviedb.org; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a1814">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="OTTpaper – a free, non-commercial personal tool to find where movies and TV shows can be streamed.">
<title>OTTpaper – OTT 통합 검색</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" id="skip" href="#/"></a>
<header class="mast" id="mast">
  <div class="plate">
    <p class="ear" id="earL"></p>
    <a class="brand" href="#/">OTTpaper</a>
    <p class="ear ear-r" id="earR"></p>
  </div>
  <div class="folio"><span id="volno"></span><span id="dateline"></span><span id="edition"></span></div>
</header>
<div class="bar" id="bar">
  <div class="bar-in">
    <a class="mini" href="#/" tabindex="-1" aria-hidden="true">OTTpaper</a>
    <nav class="nav" aria-label="Menu"><a id="navHome" href="#/"></a><a id="navNews" href="#/news"></a><a id="navTonight" href="#/tonight"></a><a id="navClips" href="#/clippings"></a><a id="navSet" href="#/settings"></a></nav>
    <form id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search" list="qlist" enterkeyhint="search">
      <datalist id="qlist"></datalist>
    </form>
  </div>
</div>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<footer class="attrib">
  <p class="colo-plate" aria-hidden="true">OTTpaper</p>
  <div class="colo">
    <p id="f1"></p>
    <p id="f2"></p>
    <p id="f3"></p>
  </div>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
